<!-- DEV TOOL — not included in game build -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avatar Canvas — Dev Tool</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a22;
    --surface: #23232e;
    --border: #3a3a4a;
    --accent: #c9a84c;
    --text: #e8e0d0;
    --muted: #888;
    --gold: #c9a84c;
    --panel-w: 200px;
    --output-h: 180px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    display: grid;
    grid-template-columns: var(--panel-w) 1fr var(--panel-w);
    grid-template-rows: 40px 1fr var(--output-h);
    grid-template-areas:
      "header header header"
      "left   canvas right"
      "output output output";
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    grid-area: header;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 1rem;
    gap: 1rem;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.85rem;
    color: var(--gold);
    letter-spacing: 0.08em;
  }
  header span { color: var(--muted); font-family: system-ui; font-size: 0.7rem; letter-spacing: 0; }

  /* ── Panels ── */
  .panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 0.75rem;
    gap: 0.5rem;
  }
  .panel.right { border-right: none; border-left: 1px solid var(--border); }
  .panel-title {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.25rem;
  }

  /* ── Gender toggle ── */
  .gender-btns { display: flex; gap: 0.4rem; }
  .gender-btn {
    flex: 1;
    padding: 0.3rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.75rem;
    transition: border-color 0.15s, color 0.15s;
  }
  .gender-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* ── Avatar thumbnails ── */
  .avatar-thumb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
  .avatar-thumb {
    border: 2px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    aspect-ratio: 1;
    background: #111;
    transition: border-color 0.15s;
  }
  .avatar-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-thumb.active { border-color: var(--accent); }

  /* ── Equipment items ── */
  .equip-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
  }
  .equip-item:hover { border-color: var(--muted); }
  .equip-item.active { border-color: var(--accent); background: rgba(201,168,76,0.08); }
  .equip-item img { width: 32px; height: 32px; object-fit: contain; }
  .equip-item-label { font-size: 0.7rem; color: var(--muted); line-height: 1.2; }
  .equip-item.active .equip-item-label { color: var(--text); }

  /* ── Canvas area ── */
  #canvas-area {
    grid-area: canvas;
    display: flex;
    align-items: center;
    justify-content: center;
    background: repeating-conic-gradient(#1f1f28 0% 25%, #222230 0% 50%) 0 0 / 20px 20px;
    overflow: hidden;
    position: relative;
  }

  /* Avatar container — mirrors .char-avatar in game */
  #avatar-container {
    position: relative;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 2px solid var(--border);
    overflow: visible;
    background: #111;
    flex-shrink: 0;
  }
  #avatar-container img.base-avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }

  /* Overlay images — mirrors .equip-overlay in style.css */
  .equip-overlay {
    position: absolute;
    width: 65%;
    height: 65%;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    object-fit: contain;
    cursor: grab;
    box-sizing: border-box;
  }
  .equip-overlay.dragging { cursor: grabbing; opacity: 0.85; }
  .equip-overlay.selected {
    outline: 2px dashed var(--accent);
    outline-offset: 2px;
  }

  /* Resize handle */
  .resize-handle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border: 1px solid #000;
    border-radius: 2px;
    bottom: -5px;
    right: -5px;
    cursor: se-resize;
    z-index: 100;
  }

  /* ── Output panel ── */
  #output-panel {
    grid-area: output;
    background: #111;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #output-toolbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.75rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #output-toolbar label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  #copy-btn {
    margin-left: auto;
    padding: 0.25rem 0.75rem;
    background: var(--accent);
    color: #1a1a22;
    border: none;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.15s;
  }
  #copy-btn:hover { opacity: 0.85; }
  #css-output {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 0.75rem;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.72rem;
    color: #a8d8a8;
    white-space: pre;
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  Avatar Canvas
  <span>DEV TOOL — drag overlays to position, resize from bottom-right corner</span>
</header>

<!-- Left: Avatar selector -->
<aside class="panel" id="left-panel">
  <div class="panel-title">Character</div>

  <div class="gender-btns">
    <button class="gender-btn active" data-gender="male">Male</button>
    <button class="gender-btn" data-gender="female">Female</button>
  </div>

  <div class="panel-title" style="margin-top:0.5rem">Style</div>
  <div class="avatar-thumb-grid" id="avatar-thumbs"></div>
</aside>

<!-- Center: Canvas -->
<main id="canvas-area">
  <div id="avatar-container">
    <img class="base-avatar" id="base-img" src="" alt="Avatar" />
  </div>
</main>

<!-- Right: Equipment -->
<aside class="panel right" id="right-panel">
  <div class="panel-title">Equipment</div>
  <div id="equip-list"></div>
</aside>

<!-- Bottom: CSS output -->
<div id="output-panel">
  <div id="output-toolbar">
    <label>Generated CSS</label>
    <button id="copy-btn">Copy CSS</button>
  </div>
  <div id="css-output"></div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────

const BASE = '../../public';

const AVATAR_STYLES = ['A', 'B', 'C'];

const EQUIPMENT = [
  { id: 3,  name: 'Leather Armor',   base: 'leather_armor',   slot: 'armor'   },
  { id: 4,  name: 'Iron Shield',     base: 'iron_shield',     slot: 'shield'  },
  { id: 12, name: 'Oak Shield',      base: 'oak_shield',      slot: 'shield'  },
  { id: 15, name: 'Hunter Armor',    base: 'hunter_armor',    slot: 'armor'   },
  { id: 31, name: 'Iron Gauntlets',  base: 'iron_gauntlets',  slot: 'gauntlet'},
  { id: 33, name: 'Leather Boots',   base: 'boot_leather',    slot: 'boots'   },
];

// Slot render order (z-index): armor first (back), then gauntlet, shield, boots, helmet
const SLOT_ORDER = ['armor', 'gauntlet', 'boots', 'shield', 'helmet'];

// Baseline offsets from style.css — expressed as percentages (matching game CSS)
// These seed the tool so you adjust from a real baseline.
const DEFAULTS = {
  armor:        { top: 40,   left: 50,   width: 65,  height: 65  },
  'armor-f':    { top: 44,   left: 50,   width: 65,  height: 65  },
  shield:       { top: 50,   left: 72,   width: 45,  height: 45  },
  boots:        { top: 75,   left: 49.5, width: 73,  height: 49  },
  'boots-f':    { top: 83,   left: 49,   width: 73,  height: 49  },
  gauntlet:     { top: 50,   left: 50,   width: 45,  height: 45  },
  helmet:       { top: 17,   left: 50,   width: 50,  height: 50  },
};

// ── State ─────────────────────────────────────────────────────────────────────

let state = {
  gender: 'male',
  avatarStyle: 'A',
  activeItems: new Set(),   // item id numbers
  overlays: {},             // slot → { top, left, width, height } in %
};

const STORAGE_KEY = 'avatar-canvas-v1';

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.gender) state.gender = saved.gender;
    if (saved.avatarStyle) state.avatarStyle = saved.avatarStyle;
    if (saved.activeItems) state.activeItems = new Set(saved.activeItems);
    if (saved.overlays) state.overlays = saved.overlays;
  } catch (_) {}
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    gender: state.gender,
    avatarStyle: state.avatarStyle,
    activeItems: [...state.activeItems],
    overlays: state.overlays,
  }));
}

// ── DOM refs ──────────────────────────────────────────────────────────────────

const baseImg        = document.getElementById('base-img');
const avatarContainer = document.getElementById('avatar-container');
const avatarThumbs   = document.getElementById('avatar-thumbs');
const equipList      = document.getElementById('equip-list');
const cssOutput      = document.getElementById('css-output');
const copyBtn        = document.getElementById('copy-btn');

// ── Avatar selector ───────────────────────────────────────────────────────────

function buildAvatarThumbs() {
  avatarThumbs.innerHTML = '';
  AVATAR_STYLES.forEach(style => {
    const src = `${BASE}/avatars/selection/${state.gender}_selection_${style}.png`;
    const div = document.createElement('div');
    div.className = 'avatar-thumb' + (state.avatarStyle === style ? ' active' : '');
    div.dataset.style = style;
    div.innerHTML = `<img src="${src}" alt="${state.gender} ${style}" />`;
    div.addEventListener('click', () => {
      state.avatarStyle = style;
      saveState();
      buildAvatarThumbs();
      updateBaseAvatar();
    });
    avatarThumbs.appendChild(div);
  });
}

function updateBaseAvatar() {
  const src = `${BASE}/avatars/selection/${state.gender}_selection_${state.avatarStyle}.png`;
  baseImg.src = src;
}

// ── Gender toggle ─────────────────────────────────────────────────────────────

document.querySelectorAll('.gender-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.gender = btn.dataset.gender;
    document.querySelectorAll('.gender-btn').forEach(b => b.classList.toggle('active', b === btn));
    saveState();
    buildAvatarThumbs();
    updateBaseAvatar();
    buildEquipList();
    rebuildOverlays();
  });
});

// ── Equipment list ────────────────────────────────────────────────────────────

function equipImgSrc(eq) {
  return `${BASE}/items/${eq.base}_${state.gender}.png`;
}

function buildEquipList() {
  equipList.innerHTML = '';
  EQUIPMENT.forEach(eq => {
    const active = state.activeItems.has(eq.id);
    const div = document.createElement('div');
    div.className = 'equip-item' + (active ? ' active' : '');
    div.dataset.id = eq.id;
    div.innerHTML = `
      <img src="${equipImgSrc(eq)}" alt="${eq.name}" onerror="this.style.opacity=0.3" />
      <span class="equip-item-label">${eq.name}</span>
    `;
    div.addEventListener('click', () => {
      if (state.activeItems.has(eq.id)) {
        state.activeItems.delete(eq.id);
        // Remove overlay for this item's slot if no other item of same slot is active
        const sameSlotActive = EQUIPMENT.filter(e => e.slot === eq.slot && state.activeItems.has(e.id));
        if (sameSlotActive.length === 0) {
          delete state.overlays[slotKey(eq.slot)];
        }
      } else {
        state.activeItems.add(eq.id);
      }
      saveState();
      buildEquipList();
      rebuildOverlays();
    });
    equipList.appendChild(div);
  });
}

// ── Slot key (accounts for gender variants) ───────────────────────────────────

function slotKey(slot) {
  if ((slot === 'armor' || slot === 'boots') && state.gender === 'female') {
    return slot + '-f';
  }
  return slot;
}

function getSlotDefault(slot) {
  return { ...( DEFAULTS[slotKey(slot)] || DEFAULTS[slot] || { top: 50, left: 50, width: 60, height: 60 } ) };
}

// ── Overlay rendering & dragging ──────────────────────────────────────────────

let selectedSlot = null;

function rebuildOverlays() {
  // Remove all existing overlays
  avatarContainer.querySelectorAll('.equip-overlay').forEach(el => el.remove());

  // Collect active items grouped by slot (last active wins per slot)
  const activeBySlot = {};
  EQUIPMENT.forEach(eq => {
    if (state.activeItems.has(eq.id)) {
      activeBySlot[eq.slot] = eq;
    }
  });

  // Render in slot order
  SLOT_ORDER.forEach((slot, zIdx) => {
    const eq = activeBySlot[slot];
    if (!eq) return;

    const key = slotKey(slot);
    if (!state.overlays[key]) {
      state.overlays[key] = getSlotDefault(slot);
    }
    const pos = state.overlays[key];

    const img = document.createElement('img');
    img.className = 'equip-overlay' + (selectedSlot === key ? ' selected' : '');
    img.dataset.slot = key;
    img.src = equipImgSrc(eq);
    img.alt = '';
    img.style.cssText = `
      top: ${pos.top}%;
      left: ${pos.left}%;
      width: ${pos.width}%;
      height: ${pos.height}%;
      z-index: ${zIdx + 1};
    `;

    // Resize handle
    const handle = document.createElement('div');
    handle.className = 'resize-handle';
    handle.dataset.slot = key;

    img.appendChild(handle);
    avatarContainer.appendChild(img);

    makeDraggable(img, key);
    makeResizable(handle, img, key);

    img.addEventListener('mousedown', (e) => {
      if (e.target === handle) return;
      selectedSlot = key;
      rebuildOverlays();
      e.stopPropagation();
    });
  });

  updateCssOutput();
}

avatarContainer.addEventListener('mousedown', (e) => {
  if (e.target === avatarContainer || e.target === baseImg) {
    selectedSlot = null;
    rebuildOverlays();
  }
});

function makeDraggable(img, key) {
  let startX, startY, startTop, startLeft;
  const containerRect = () => avatarContainer.getBoundingClientRect();

  img.addEventListener('mousedown', onDown);

  function onDown(e) {
    if (e.target.classList.contains('resize-handle')) return;
    e.preventDefault();
    selectedSlot = key;
    rebuildOverlays();

    const pos = state.overlays[key];
    startX = e.clientX;
    startY = e.clientY;
    startTop  = pos.top;
    startLeft = pos.left;

    img.classList.add('dragging');

    function onMove(e) {
      const rect = containerRect();
      const dx = ((e.clientX - startX) / rect.width)  * 100;
      const dy = ((e.clientY - startY) / rect.height) * 100;
      state.overlays[key].top  = parseFloat((startTop  + dy).toFixed(2));
      state.overlays[key].left = parseFloat((startLeft + dx).toFixed(2));
      img.style.top  = state.overlays[key].top  + '%';
      img.style.left = state.overlays[key].left + '%';
      updateCssOutput();
      saveState();
    }

    function onUp() {
      img.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }
}

function makeResizable(handle, img, key) {
  handle.addEventListener('mousedown', onDown);

  function onDown(e) {
    e.preventDefault();
    e.stopPropagation();

    const rect = avatarContainer.getBoundingClientRect();
    const startX = e.clientX;
    const startY = e.clientY;
    const startW = state.overlays[key].width;
    const startH = state.overlays[key].height;

    function onMove(e) {
      const dw = ((e.clientX - startX) / rect.width)  * 100;
      const dh = ((e.clientY - startY) / rect.height) * 100;
      const newW = Math.max(5, parseFloat((startW + dw).toFixed(2)));
      const newH = Math.max(5, parseFloat((startH + dh).toFixed(2)));
      state.overlays[key].width  = newW;
      state.overlays[key].height = newH;
      img.style.width  = newW + '%';
      img.style.height = newH + '%';
      updateCssOutput();
      saveState();
    }

    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }
}

// ── CSS output ────────────────────────────────────────────────────────────────

function formatVal(n) { return parseFloat(n.toFixed(2)) + '%'; }

function updateCssOutput() {
  const lines = [];

  const slotCssClass = {
    armor:     '.equip-overlay',
    'armor-f': '.equip-overlay-armor--female',
    shield:    '.equip-overlay.equip-overlay-shield',
    boots:     '.equip-overlay.equip-overlay-boots',
    'boots-f': '.equip-overlay.equip-overlay-boots--female',
    gauntlet:  '.equip-overlay.equip-overlay-gauntlet',
    helmet:    '.equip-overlay.equip-overlay-helmet',
  };

  // Show all defaults with current positions if active
  const allSlots = ['armor', 'armor-f', 'shield', 'boots', 'boots-f', 'gauntlet', 'helmet'];
  allSlots.forEach(key => {
    const pos = state.overlays[key] || DEFAULTS[key];
    if (!pos) return;
    const cls = slotCssClass[key] || `.equip-overlay-${key}`;
    lines.push(`${cls} {`);
    lines.push(`  top: ${formatVal(pos.top)}; left: ${formatVal(pos.left)};`);
    lines.push(`  width: ${formatVal(pos.width)}; height: ${formatVal(pos.height)};`);
    lines.push(`}`);
    lines.push('');
  });

  cssOutput.textContent = lines.join('\n');
}

// ── Copy button ───────────────────────────────────────────────────────────────

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(cssOutput.textContent).then(() => {
    const orig = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = orig, 1500);
  }).catch(() => {
    // Fallback for file:// context
    const ta = document.createElement('textarea');
    ta.value = cssOutput.textContent;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    const orig = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = orig, 1500);
  });
});

// ── Reset button for convenience ──────────────────────────────────────────────
(function addResetBtn() {
  const btn = document.createElement('button');
  btn.textContent = 'Reset Positions';
  btn.style.cssText = 'margin-left:0.5rem;padding:0.25rem 0.6rem;background:transparent;border:1px solid #555;color:#888;border-radius:4px;font-size:0.7rem;cursor:pointer;';
  btn.addEventListener('click', () => {
    state.overlays = {};
    saveState();
    rebuildOverlays();
  });
  document.getElementById('output-toolbar').appendChild(btn);
})();

// ── Init ──────────────────────────────────────────────────────────────────────

loadState();

// Sync gender buttons
document.querySelectorAll('.gender-btn').forEach(b => {
  b.classList.toggle('active', b.dataset.gender === state.gender);
});

buildAvatarThumbs();
updateBaseAvatar();
buildEquipList();
rebuildOverlays();
updateCssOutput();
</script>
</body>
</html>
